name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # roz raat 12 baje (UTC) auto-run
  workflow_dispatch:        # manually bhi "Run workflow" button se trigger kar sakte ho

permissions:
  contents: write            # missing tha pehle -> "permission denied" push error deta tha

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/profile3d.json



      - name: Remove language circle from SVG
        run: |
          python3 - <<'EOF'
          import re
          path = "profile-3d-contrib/profile-red-theme.svg"
          svg = open(path, encoding="utf-8").read()
          new_svg = re.sub(
              r'<g transform="translate\(40, 520\)">.*?(?=<g><text style="font-size: 32px)',
              '',
              svg,
              flags=re.DOTALL,
          )
          if new_svg == svg:
              print("Circle block not found, nothing removed")
          else:
              print("Circle removed")
          open(path, "w", encoding="utf-8").write(new_svg)
          EOF
          
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update 3D contribution graph"
          git push
