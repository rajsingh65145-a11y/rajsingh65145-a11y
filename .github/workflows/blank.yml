name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # roz raat 12 baje (UTC) auto-run
  workflow_dispatch:        # manually bhi "Run workflow" button se trigger kar sakte ho

permissions:
  contents: write            # missing tha pehle -> "permission denied" push error deta tha

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update 3D contribution graph"
          git push
