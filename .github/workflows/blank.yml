name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # roz raat 12 baje (UTC) auto-run
  workflow_dispatch:        # manually bhi "Run workflow" button se trigger kar sakte ho

permissions:
  contents: write            # missing tha pehle -> "permission denied" push error deta tha

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/profile3d.json


       - name: Remove language circle from SVG
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          ns = "http://www.w3.org/2000/svg"
          ET.register_namespace("", ns)
          path = "profile-3d-contrib/profile-red-theme.svg"
          tree = ET.parse(path)
          root = tree.getroot()
          removed = 0
          for g in list(root.findall(f"{{{ns}}}g")):
              t = g.get("transform", "").replace(" ", "")
              if t == "translate(40,520)":
                  root.remove(g)
                  removed += 1
          print("Removed groups:", removed)
          tree.write(path, encoding="utf-8", xml_declaration=False)
          EOF

          
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update 3D contribution graph"
          git push
